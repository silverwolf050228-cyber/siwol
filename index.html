<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untukmu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        /* Dekorasi Efek Cahaya di Background */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(80px);
            top: 10%;
            left: 15%;
        }

        /* Kotak Utama di Tengah */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(220, 100, 130, 0.2);
            text-align: center;
            max-width: 400px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(220, 100, 130, 0.3);
        }

        /* Elemen Ikon Hati */
        .heart-icon {
            font-size: 50px;
            color: #e63946;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        /* Judul */
        h1 {
            color: #d62828;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Teks Pesan */
        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Tombol Interaktif */
        .btn {
            background-color: #e63946;
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230, 57, 70, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #c1121f;
            transform: scale(1.05);
        }

        /* Animasi Detak Hati */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">❤️</div>
        <h1>Halo, Kamu!</h1>
        <p>Hanya ingin mengingatkanmu bahwa kamu sangat berharga dan selalu berhasil membuat hariku jadi lebih indah.</p>
       <a href="halaman2.html" class="btn">Next Page &rarr;</a>
    </div>

</body>
</html>
